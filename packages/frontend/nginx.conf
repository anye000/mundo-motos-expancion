events {
    worker_connections 1024;
}

http {
    types {
        text/html                  html htm;
        text/css                   css;
        text/javascript            js;
        text/xml                   xml;
        image/gif                  gif;
        image/jpeg                 jpeg jpg;
        image/png                  png;
        image/svg+xml              svg svgz;
        application/font-sfnt      ttf otf;
        application/font-woff      woff;
        application/font-woff2     woff2;
        application/json           json;
        application/manifest+json  webmanifest;
    }

    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Caché para archivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Caché corta para manifest.json
        location = /manifest.json {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type "application/manifest+json";
        }

        # Caché corta para service worker
        location = /sw.js {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type "application/javascript";
        }

        # Sin caché para HTML
        location ~* \.html$ {
            add_header Cache-Control "public, max-age=0";
            expires off;
        }

        # SPA - Fallback a index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=0";
            expires off;
        }

        # Proxy a API
        location /api/ {
            proxy_pass http://backend:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Negar acceso a archivos sensibles
        location ~ /\. {
            deny all;
        }
    }
}
