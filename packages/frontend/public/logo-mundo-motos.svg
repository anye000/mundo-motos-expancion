<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Mundo Motos logo: alas/V sobre fondo negro -->
  <circle cx="500" cy="500" r="500" fill="#000000"/>
  
  <!-- Logo ala/V amarillo, centrado -->
  <g transform="translate(500, 460)">
    <!-- Ala izquierda - segmento externo -->
    <polygon points="
      0,140
      -40,80
      -120,-20
      -240,-160
      -380,-300
      -480,-400
      -520,-440
      -490,-380
      -400,-280
      -260,-140
      -100,10
      -20,80
    " fill="#FFCC00"/>
    
    <!-- Ala izquierda - corte interno 1 (creates gap) -->
    <polygon points="
      -50,60
      -140,-30
      -270,-170
      -400,-300
      -490,-390
      -470,-350
      -370,-250
      -230,-120
      -80,10
      -30,60
    " fill="#000000"/>
    
    <!-- Ala izquierda - segmento medio -->
    <polygon points="
      -60,40
      -160,-50
      -290,-190
      -420,-320
      -510,-420
      -490,-380
      -380,-270
      -250,-140
      -90,0
      -40,50
    " fill="#FFCC00"/>
    
    <!-- Ala izquierda - corte interno 2 -->
    <polygon points="
      -70,20
      -180,-60
      -310,-200
      -440,-340
      -520,-430
      -500,-400
      -390,-280
      -260,-150
      -100,-10
      -50,30
    " fill="#000000"/>
    
    <!-- Ala izquierda - segmento interno -->
    <polygon points="
      -80,0
      -190,-70
      -320,-210
      -450,-350
      -530,-440
      -510,-410
      -400,-290
      -270,-160
      -110,-20
      -60,10
    " fill="#FFCC00"/>
    
    <!-- Ala derecha - segmento externo (mirror) -->
    <polygon points="
      0,140
      40,80
      120,-20
      240,-160
      380,-300
      480,-400
      520,-440
      490,-380
      400,-280
      260,-140
      100,10
      20,80
    " fill="#FFCC00"/>
    
    <!-- Ala derecha - corte interno 1 -->
    <polygon points="
      50,60
      140,-30
      270,-170
      400,-300
      490,-390
      470,-350
      370,-250
      230,-120
      80,10
      30,60
