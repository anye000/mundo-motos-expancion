    <!-- Ala derecha - corte interno 2 -->
    <polygon points="
      70,20
      180,-60
      310,-200
      440,-340
      520,-430
      500,-400
      390,-280
      260,-150
      100,-10
      50,30
    " fill="#000000"/>
    
    <!-- Ala derecha - segmento interno -->
    <polygon points="
      80,0
      190,-70
      320,-210
      450,-350
      530,-440
      510,-410
      400,-290
      270,-160
      110,-20
      60,10
    " fill="#FFCC00"/>
