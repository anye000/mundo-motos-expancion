version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: mundo-motos-db
    environment:
      POSTGRES_DB: ${DB_NAME:-mundo_motos_crm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mundo-motos-network

  # Backend - Node.js/Express
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: mundo-motos-backend
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-mundo_motos_crm}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: 5432
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend/src:/app/src
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mundo-motos-network
    command: npm run dev:backend

  # Frontend - React/Vite
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: mundo-motos-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
      VITE_APP_NAME: Mundo Motos CRM
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/src
      - ./packages/frontend/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mundo-motos-network
    command: npm run dev:frontend

  # Redis (Opcional para caché)
  redis:
    image: redis:7-alpine
    container_name: mundo-motos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mundo-motos-network
    command: redis-server --appendonly yes

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mundo-motos-network:
    driver: bridge
